name: Test custom shell post-run script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Set post-run script with custom shell
        uses: .
        with:
          post-run: |
            echo "Custom shell post run executed"
          shell: bash -e {0}

      - name: Assert action step succeeded with custom shell
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: action step with custom shell did not succeed"
            exit 1
          fi
          echo "PASS: action step with custom shell succeeded"
