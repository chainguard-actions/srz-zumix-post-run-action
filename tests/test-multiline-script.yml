name: Test multiline post-run script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        name: Set multiline post-run script
        uses: .
        with:
          post-run: |
            echo "Step 1: starting post run"
            echo "Step 2: doing work"
            DATE=$(date)
            echo "Step 3: current date is $DATE"
            echo "Step 4: post run complete"
      - name: Assert action step succeeded with multiline script
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with multiline script, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action step succeeded with multiline script"
